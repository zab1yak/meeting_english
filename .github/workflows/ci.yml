name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Postgres — для интеграционных тестов (миграции применяет globalSetup Vitest)
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: meeting
          POSTGRES_PASSWORD: meeting
          POSTGRES_DB: meeting_english
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U meeting" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://meeting:meeting@localhost:5432/meeting_english
      # Тесты очищают таблицы; в CI база одноразовая, поэтому та же
      TEST_DATABASE_URL: postgresql://meeting:meeting@localhost:5432/meeting_english
      REDIS_URL: redis://localhost:6379
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker compose build
      - name: Smoke-тест стека
        run: |
          docker compose up -d --wait --wait-timeout 120
          curl -fsS http://127.0.0.1:3000/api/health
          # /login грузит @me/auth: проверяет, что нативный argon2 (musl) попал в образ
          curl -fsS -o /dev/null http://127.0.0.1:3000/login
          curl -fsS http://127.0.0.1:3001/health | grep -q '"redis":"connected"'
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
